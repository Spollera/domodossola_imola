<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Messaggio riservato</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    .container {
        width: 90%;
        max-width: 500px;
    }

    .access {
        font-size: 14px;
        letter-spacing: 3px;
        color: #777;
        margin-bottom: 30px;
    }

    .message {
        opacity: 0;
        transform: translateY(20px);
        animation: appear 1.5s ease forwards;
        animation-delay: 1.5s;
    }

    h1 {
        font-size: 28px;
        letter-spacing: 4px;
        margin-bottom: 40px;
    }

    .main {
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 35px;
    }

    .signature {
        font-size: 20px;
        color: #aaa;
        font-style: italic;
    }

    .bottom {
        margin-top: 50px;
        font-size: 13px;
        color: #555;
    }

    @keyframes appear {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="access">
        ACCESSO AUTORIZZATO ✓
    </div>

    <div class="message">

        <h1>MESSAGGIO RISERVATO</h1>

        <div class="main">
    Pioggia, sappi che sei bona. ❤️
    </div>

    <div class="signature">
    Cordiali saluti, Domodossola Imola. 🐴
    </div>

    </div>

</div>

</body>
</html>
